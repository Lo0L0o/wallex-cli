[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-cli-learning"
version = "0.1.0"
description = "A small Python CLI project for learning application structure"
requires-python = ">=3.10"
dependencies = [
    "aiosqlite>=0.20",
    "mysql-connector-python>=8.0",
    "httpx>=0.27",
]

[project.scripts]
market-cli = "market.main:main"

[tool.setuptools.packages.find]
where = ["src"]
