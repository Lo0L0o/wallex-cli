[build-system]
requires = ["poetry-core>=2.0,<3.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "market-cli-learning"
version = "0.1.0"
description = "A small Python CLI project for learning application structure"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiosqlite>=0.20",
    "mysql-connector-python>=8.0",
    "httpx>=0.27",
    "SQLAlchemy[asyncio]>=2.0,<2.1",
    "alembic>=1.13,<2",
    "pydantic>=2.9,<3",
    "redis>=5,<7",
    "APScheduler>=3.10,<4",
    "starlette>=0.47,<1",
    "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = ["ruff>=0.11"]

[project.scripts]
serve = "market.presentation.web:serve"
migrate = "market.presentation.manage:migrate"
market-cli = "market.main:cli"
market-web = "market.presentation.web:serve"

[tool.poetry]
packages = [{ include = "market", from = "src" }]
include = [
    { path = "alembic.ini", format = "sdist" },
    { path = "migrations", format = "sdist" },
]
